plugins {
    id 'com.android.application'
}

// Override with: gradlew assembleRelease -Pps2xBootElf=/absolute/path/on/device.elf
def ps2xBootElf = project.findProperty('ps2xBootElf')
        ?: '/storage/emulated/0/Android/data/com.ps2x.runner/files/boot.elf'
// Set for a private full build, e.g. -Pps2xGameSerial=SCES_531.33. Empty accepts PAL or USA.
def ps2xGameSerial = project.findProperty('ps2xGameSerial') ?: ''
// Version overrides for CI/releases: -Pps2xVersionCode=3 -Pps2xVersionName=0.2.1
def ps2xVersionCode = (project.findProperty('ps2xVersionCode') ?: '2').toInteger()
def ps2xVersionName = project.findProperty('ps2xVersionName') ?: '0.2.0'
def gitSha = 'unknown'
try {
    gitSha = providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
} catch (Exception ignored) {
}

android {
    namespace 'com.ps2x.runner'
    compileSdk 34
    ndkVersion '28.2.13676358'

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.ps2x.runner'
        minSdk 28
        targetSdk 34
        versionCode ps2xVersionCode
        versionName ps2xVersionName
        buildConfigField 'String', 'BUILD_SHA', "\"${gitSha}\""

        externalNativeBuild {
            cmake {
                arguments '-DPS2X_BUILD_RECOMP=OFF',
                        '-DPS2X_BUILD_ANALYZER=OFF',
                        '-DPS2X_BUILD_TEST=OFF',
                        '-DPS2X_BUILD_STUDIO=OFF',
                        '-DPS2X_ENABLE_SCCACHE=OFF',
                        '-DPS2X_RUNNER_UNITY_BUILD_BATCH_SIZE=32',
                        '-DANDROID_CPP_FEATURES=rtti exceptions',
                        "-DPS2X_DEFAULT_BOOT_ELF=${ps2xBootElf}",
                        "-DPS2X_GAME_SERIAL=${ps2xGameSerial}"
                targets 'ps2EntryRunner'
            }
        }

        ndk {
            // The A20 and every realistic Mali target are arm64. Keeping the
            // CI build single-ABI cuts the NDK build time roughly in half.
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
