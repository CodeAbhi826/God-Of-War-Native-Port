name: android

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - 'ps2xRuntime/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'

jobs:
  build-runner-apk:
    name: arm64 runner APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already carries the Android SDK; the
      # setup-android action currently fails on the removed "tools" package,
      # so configure the preinstalled SDK directly.
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install NDK, CMake and platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps2x-runner-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
